[env]
# Recent rustc releases (seen with 1.98) no longer pass `--allow-undefined` to `wasm-ld`, but the
# host-function imports generated by polkadot-sdk stable2512 (`sp-runtime-interface` 33) rely on
# it. Without this the runtime's wasm build fails with `undefined symbol: ext_storage_get_version_1`
# and similar. Later polkadot-sdk releases declare the imports explicitly
# (`sp-runtime-interface-proc-macro` 21.0.1); this can be dropped once the SDK is upgraded past
# stable2512.
WASM_BUILD_RUSTFLAGS = "-C link-arg=--allow-undefined"
